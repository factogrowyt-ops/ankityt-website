<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - ANKIT YT</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f7f7f7; margin:0; padding:20px; color:#222; }
    h1 { color:#0a7c7c; }
    .card { background:#fff; border-radius:10px; padding:16px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
    .card img { width:100%; border-radius:8px; margin-bottom:10px; }
    .card h2 { margin:0 0 6px; font-size:20px; }
    .date { color:#888; font-size:13px; margin-bottom:8px; }
    .excerpt { font-size:15px; line-height:1.5; }
    a.readmore { display:inline-block; margin-top:8px; color:#0a7c7c; font-weight:bold; text-decoration:none; }
    #empty { text-align:center; color:#999; margin-top:40px; }
  </style>
</head>
<body>
  <h1>Latest Posts</h1>
  <div id="postsContainer"></div>
  <p id="empty" style="display:none;">अभी कोई पोस्ट नहीं है। /admin पर जाकर पहली पोस्ट डालें।</p>

  <script>
    fetch('content/posts.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('postsContainer');
        const posts = (data.posts || []).slice().reverse(); // नई पोस्ट सबसे ऊपर

        if (posts.length === 0) {
          document.getElementById('empty').style.display = 'block';
          return;
        }

        posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${post.image ? `<img src="${post.image}" alt="${post.title}">` : ''}
            <h2>${post.title || ''}</h2>
            <div class="date">${post.date || ''}</div>
            <div class="excerpt">${post.excerpt || ''}</div>
          `;
          container.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('empty').style.display = 'block';
      });
  </script>
</body>
</html>
